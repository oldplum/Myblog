name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Override URL for GitHub Pages
        run: |
          sed -i 's|^url:.*|url: https://oldplum.github.io/Myblog|' _config.yml
          sed -i 's|^root:.*|root: /Myblog/|' _config.yml
          sed -i "s|^title:.*|title: oldplum's blog（备用站）|" _config.yml
          sed -i 's#备用站: https://oldplum.github.io/Myblog/ || fas fa-globe#主站: https://blog.oldplum.dev/ || fas fa-globe#' themes/butterfly/_config.yml

      - name: Generate static files
        run: npx hexo generate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages